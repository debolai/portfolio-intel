<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Portfolio Intelligence architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5af8"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.2; rx: 8; }
      .core { fill: #eef4ff; stroke: #3e63dd; }
      .store { fill: #f0fdf4; stroke: #16a34a; }
      .ext { fill: #f9fafb; stroke: #98a2b3; stroke-dasharray: 4 3; }
      .t { fill: #101828; font-weight: 600; }
      .s { fill: #475467; font-size: 11.5px; }
      .edge { stroke: #475467; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .otel { stroke: #7a5af8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-dash); }
      .lbl { fill: #475467; font-size: 11px; }
      .lblo { fill: #7a5af8; font-size: 11px; }
    </style>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>

  <!-- Users -->
  <rect class="box" x="20" y="200" width="130" height="56"/>
  <text class="t" x="85" y="224" text-anchor="middle">Portfolio</text>
  <text class="t" x="85" y="241" text-anchor="middle">manager</text>

  <rect class="box" x="195" y="130" width="150" height="56"/>
  <text class="t" x="270" y="154" text-anchor="middle">Claude Desktop</text>
  <text class="s" x="270" y="172" text-anchor="middle">any MCP client</text>

  <rect class="box" x="195" y="270" width="150" height="56"/>
  <text class="t" x="270" y="294" text-anchor="middle">Web chat / REST</text>
  <text class="s" x="270" y="312" text-anchor="middle">other teams, /docs</text>

  <path class="edge" d="M150,220 L193,165"/>
  <path class="edge" d="M150,236 L193,292"/>

  <!-- AWS boundary -->
  <rect x="380" y="20" width="560" height="520" rx="12" fill="#fcfcfd" stroke="#d0d5dd" stroke-width="1.2"/>
  <text class="t" x="400" y="44">AWS (Terraform)</text>
  <text class="s" x="400" y="528">Same image and stack run locally in Docker Compose</text>

  <rect class="box" x="400" y="190" width="110" height="80"/>
  <text class="t" x="455" y="224" text-anchor="middle">ALB + WAF</text>
  <text class="s" x="455" y="242" text-anchor="middle">bearer auth</text>

  <path class="edge" d="M345,158 L398,215"/>
  <text class="lbl" x="240" y="120">MCP over HTTPS</text>
  <path class="edge" d="M345,298 L398,248"/>
  <text class="lbl" x="300" y="345">REST</text>

  <rect class="box" x="560" y="280" width="160" height="64"/>
  <text class="t" x="640" y="306" text-anchor="middle">Agent + REST API</text>
  <text class="s" x="640" y="324" text-anchor="middle">tool loop · grounding check</text>

  <rect class="box" x="560" y="110" width="160" height="64"/>
  <text class="t" x="640" y="136" text-anchor="middle">MCP server</text>
  <text class="s" x="640" y="154" text-anchor="middle">9 read-only tools · guardrails</text>

  <path class="edge" d="M510,215 L558,150"/>
  <path class="edge" d="M510,248 L558,300"/>
  <path class="edge" d="M640,278 L640,176"/>
  <text class="lbl" x="648" y="232">tool calls</text>

  <rect class="box core" x="770" y="110" width="150" height="64"/>
  <text class="t" x="845" y="136" text-anchor="middle">Analytics core</text>
  <text class="s" x="845" y="154" text-anchor="middle">TE · Euler · duration · what-if</text>
  <path class="edge" d="M720,142 L768,142"/>

  <rect class="box store" x="770" y="220" width="150" height="56"/>
  <text class="t" x="845" y="244" text-anchor="middle">DuckDB snapshot</text>
  <text class="s" x="845" y="262" text-anchor="middle">opened read-only</text>
  <path class="edge" d="M845,174 L845,218"/>

  <rect class="box store" x="770" y="330" width="150" height="56"/>
  <text class="t" x="845" y="354" text-anchor="middle">S3 data bucket</text>
  <text class="s" x="845" y="372" text-anchor="middle">versioned snapshots</text>
  <path class="edge" d="M845,328 L845,278"/>

  <rect class="box" x="770" y="450" width="150" height="56"/>
  <text class="t" x="845" y="474" text-anchor="middle">Nightly ingest</text>
  <text class="s" x="845" y="492" text-anchor="middle">validate · version · upload</text>
  <path class="edge" d="M845,448 L845,388"/>

  <rect class="box store" x="560" y="30" width="160" height="56"/>
  <text class="t" x="640" y="53" text-anchor="middle">Audit: Firehose →</text>
  <text class="s" x="640" y="71" text-anchor="middle">S3 Object Lock (WORM)</text>
  <path class="edge" d="M640,108 L640,88"/>

  <!-- External -->
  <rect class="box ext" x="970" y="280" width="130" height="56"/>
  <text class="t" x="1035" y="304" text-anchor="middle">Anthropic API</text>
  <text class="s" x="1035" y="322" text-anchor="middle">Claude</text>
  <path class="edge" d="M720,312 C 820,312 880,312 968,308"/>

  <rect class="box ext" x="970" y="450" width="130" height="56"/>
  <text class="t" x="1035" y="470" text-anchor="middle">Sources</text>
  <text class="s" x="1035" y="486" text-anchor="middle">ETF holdings CSVs,</text>
  <text class="s" x="1035" y="500" text-anchor="middle">Yahoo Finance</text>
  <path class="edge" d="M920,478 L968,478"/>

  <rect class="box ext" x="400" y="440" width="170" height="64"/>
  <text class="t" x="485" y="466" text-anchor="middle">Langfuse + X-Ray</text>
  <text class="s" x="485" y="484" text-anchor="middle">local: Jaeger</text>
  <path class="otel" d="M600,346 L545,438"/>
  <path class="otel" d="M585,176 C 540,250 530,360 500,438"/>
  <text class="lblo" x="405" y="428">OTLP traces</text>
</svg>
