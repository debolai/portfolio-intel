# ECS sidecar (AWS Distro for OpenTelemetry): X-Ray plus Langfuse.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  attributes/redact:
    actions: [{ key: pi.args, action: hash }]
exporters:
  awsxray: {}
  otlphttp/langfuse:
    endpoint: https://cloud.langfuse.com/api/public/otel
    headers: { Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}" }
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes/redact]
      exporters: [awsxray, otlphttp/langfuse]
