<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Intelligence</title>
<style>
  :root { --fg:#1d2127; --muted:#667085; --line:#e4e7ec; --bg:#fafafa; --ok:#067647; --bad:#b42318; }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  #q { flex: 1 1 360px; } #token { flex: 0 1 180px; }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--fg); color: #fff; cursor: pointer; }
  .turn { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 16px; }
  .q { font-weight: 600; margin-bottom: 8px; }
  .a { white-space: pre-wrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  code { font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <h1>Portfolio Intelligence</h1>
  <p class="sub">Read-only analytics. Every number comes from a tool; no orders can be placed.</p>
  <form id="f">
    <input id="q" placeholder="What's my active weight in European banks vs benchmark?" required>
    <input id="token" type="password" placeholder="API token" required>
    <button>Ask</button>
  </form>
  <div id="log"></div>
</main>
<script>
const f = document.getElementById("f"), log = document.getElementById("log");
const history = [];
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
f.addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("q").value, token = document.getElementById("token").value;
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.innerHTML = `<div class="q">${esc(q)}</div><div class="a">Thinking…</div>`;
  log.prepend(turn);
  try {
    const r = await fetch("/v1/ask", {method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": `Bearer ${token}`},
      body: JSON.stringify({question: q, history})});
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const d = await r.json();
    history.push({role: "user", content: q}, {role: "assistant", content: d.answer});
    const g = d.grounding.ungrounded.length
      ? `<span class="bad">ungrounded: ${d.grounding.ungrounded.join(", ")}</span>`
      : `<span class="ok">all numbers grounded</span>`;
    const tools = d.tool_calls.map(t => `<code>${esc(t.name)}</code>`).join(", ") || "none";
    turn.querySelector(".a").textContent = d.answer;
    turn.insertAdjacentHTML("beforeend", `<div class="meta">Tools: ${tools} · ${g}</div>`);
  } catch (err) {
    turn.querySelector(".a").innerHTML = `<span class="bad">${esc(String(err))}</span>`;
  }
});
</script>
</body>
</html>
